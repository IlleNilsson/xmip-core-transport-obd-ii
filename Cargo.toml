[package]
name = "xmip-core-transport-obd-ii"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-obd-ii"
description = "OBD-II transport: SAE J1979 over ISO-TP — mode 01 parameters and mode 09 vehicle information asked at the functional address 0x7DF and answered from 0x7E8; a Receive Location polls one, a Send Location answers one as the ECU. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { workspace = true, optional = true }
# The `0x` number a target names (`codec::hex`).
codec = { workspace = true, optional = true }
# The one refusal of a size over a ceiling (`net::ceiling`).
net = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The carrier, declared in architecture.toml: ISO-TP segments and reassembles,
# and re-exports the bus and frame types of can-bus beneath it. Its
# declaration alone where this crate is: the wait both default to
# (`iso_tp::declaration::DEFAULT_TIMEOUT`).
iso_tp = { workspace = true, default-features = false }
# The bus beneath ISO-TP, for the two directed loopback buses a session
# stands on: iso-tp does not re-export can-bus's bus types yet, so they are
# taken from can-bus directly until it does.
can_bus = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = [
    "declaration",
    "iso_tp/default",
    "dep:context",
    "dep:codec",
    "dep:net",
    "dep:can_bus",
]
# The declaration alone, with the parameter and the identifiers its defaults
# name and the `iso-tp` technology's wait.
declaration = ["iso_tp/declaration"]

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
